[project]
name = "learn-up"
version = "1.15"
description = "Aplicación local de estudio para cursos guiados por syllabus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "duckdb-engine>=0.13",
    "duckdb>=1.1",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pypdf>=6.14",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]
notebooklm = ["notebooklm-py[browser]>=0.8.1"]
openhands = ["openhands-sdk>=1.36.1", "openhands-tools>=1.36.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
